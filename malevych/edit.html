  <h1 id="head"></h1>
  <div id="pv" class="pv" hidden>

</main>
<div id="bar" class="bar" hidden><button id="sendA" class="btn" type="button" disabled>Надіслати Малевичу</button></div>

<script>

      if (flags !== undefined && !isInt(flags)) return null;

      n: isInt(p.n) ? p.n : Number(p.sid.slice(1)),

    host.className = "pvhost";
    const root = host.attachShadow({ mode: "open" });
    const style = document.createElement("style");
    style.textContent = P.pv.css.replace(/:root\b/g, ":host") + "\n" + SHADOW_CSS;
    const stage = document.createElement("div");
    stage.className = "mf-stage";
    stage.style.width = W + "px"; stage.style.height = H + "px";
    const ring = document.createElement("div");
    ring.className = "mf-ring"; ring.hidden = true;
    stage.append(sec, ring);
    root.append(style, stage);
    box.appendChild(host);
    $("pv").hidden = false;
    const els = {};
    for (const el of sec.querySelectorAll("[data-e]")) {
      const n = el.getAttribute("data-e");
      if (/^[1-9]\d{0,5}$/.test(n) && !els["e" + n]) els["e" + n] = el;
    }
    return { root, stage, sec, ring, els, W, H, box, k: 1, pins: [], now, shown: now };
  }
  // show another version in the same stage (S.sec stays the current slide: selection and notes belong to it)
  function swapSec(S, v) {
    if (v === S.shown) return;
    S.shown.sec.replaceWith(v.sec);
    S.shown = v; S.W = v.W; S.H = v.H;
    S.stage.style.width = v.W + "px"; S.stage.style.height = v.H + "px";
    S.box.style.aspectRatio = v.W + " / " + v.H;
  }
  // an element's box in stage pixels, whatever the current (even mid-animation) transform
  function stageRect(S, el) {
    const sr = S.stage.getBoundingClientRect(), r = el.getBoundingClientRect(), k = sr.width / S.W || 1;
    return { x: (r.left - sr.left) / k, y: (r.top - sr.top) / k, w: r.width / k, h: r.height / k };
  }

  // the ring/pin box: an HTML element's actual contents (a full-width h1 → its text), an SVG element's own box
  function contentRect(S, el) {
    if (el.namespaceURI !== SVG_NS) {
      const rg = document.createRange();
      rg.selectNodeContents(el);
      const rs = Array.from(rg.getClientRects()).filter((r) => r.width > 0 || r.height > 0);
      if (rs.length) {
        const sr = S.stage.getBoundingClientRect(), k = sr.width / S.W || 1;
        const l = Math.min(...rs.map((r) => r.left)), t = Math.min(...rs.map((r) => r.top));
        const rr = Math.max(...rs.map((r) => r.right)), bb = Math.max(...rs.map((r) => r.bottom));
        return { x: (l - sr.left) / k, y: (t - sr.top) / k, w: (rr - l) / k, h: (bb - t) / k };
      }
    }
    return stageRect(S, el);
  }

  // labels: no ⟧, no newline, ≤ 40 code points
  const TEXT_TAGS = new Set(["h1", "h2", "h3", "h4", "h5", "h6", "p", "li", "td", "th", "figcaption", "caption",
    "span", "b", "strong", "em", "i", "u", "small", "mark", "sup", "sub", "a", "q", "blockquote", "label", "dt", "dd",
    "text", "tspan", "textpath"]);
  const SHAPES = new Set(["rect", "path", "line", "circle", "ellipse", "polygon", "polyline"]);
  function textLabel(t) {
    const s = Array.from(t.replace(/[⟦⟧]/g, "").replace(/\s+/g, " ").trim());
    if (!s.length) return "";
    return "Текст: «" + (s.length > 31 ? s.slice(0, 30).join("") + "…" : s.join("")) + "»";
  }
  function labelFor(P, S, ref) {
    if (ref === "slide" || !S || !S.els[ref]) return "Весь слайд";
    const el = S.els[ref], tag = el.localName.toLowerCase();
    const mf = el.getAttribute("data-mf"), f = mf && P.f.find((x) => x.key === mf);
    if (f && f.text) return textLabel(f.text) || "Елемент";
    if (SHAPES.has(tag)) return "Фігура";
    if (tag === "g") return "Група";
    if (tag === "img" || tag === "image") return "Зображення";
    if (tag === "svg") return "Діаграма";
    const leaf = !el.firstElementChild || Array.from(el.children).every((c) => c.localName === "br");
    if (mf || TEXT_TAGS.has(tag) || (tag === "div" && leaf)) return textLabel(el.textContent || "") || "Елемент";
    return "Елемент";
  }

  async function main() {
    let P = null;
    try {
      const d = new URLSearchParams(RAW_HASH).get("d");
      if (d) P = checkPayload(await decodeD(d));
    } catch (e) { P = null; }
    if (!P) return fatal(BROKEN);

    const tier = inTg ? (P.tier === "A" || P.tier === "B" ? P.tier : "C") : "web";
    document.title = `Слайд ${P.n} · нотатки`;
    $("head").textContent = `Слайд ${P.n}` + (P.title ? ` · ${P.title}` : "");

    const S = buildSlide(P);
    if (!S) $("nopv").hidden = false;
    const note = $("note"), nlabel = $("nlabel"), wider = $("wider"), chips = $("chips");
    const send = $("send"), copyBtn = $("copy"), pre = $("msg"), sendBtn = $("sendA");
    const notes = {};                                    // ref → {label, raw}
    let sel = "slide", cur = null;
    let it = null;                                       // the earlier version on screen, or null: the current slide

    // -- view: the form's own image-viewer gestures (tap, double tap, pinch, pan); no zoom on selection -------
    const V = { z: 1, tx: 0, ty: 0 };                  // zoom over fit (1…5), translate in box px
    const ZMAX = 5, ZDBL = 2.5, SLOP = 8, DBL_MS = 280;
    const fitK = () => S.box.clientWidth / S.W || 1;
    function view(animate) {
      if (!S) return;
      const k0 = fitK();
      V.z = Math.min(ZMAX, Math.max(1, V.z));
      const k = k0 * V.z;
      V.tx = Math.min(0, Math.max(S.box.clientWidth - k * S.W, V.tx));
      V.ty = Math.min(0, Math.max(S.box.clientHeight - k * S.H, V.ty));
      S.k = k;
      S.stage.style.transition = animate ? "transform .2s ease" : "none";
      S.stage.style.transform = `translate(${V.tx.toFixed(2)}px, ${V.ty.toFixed(2)}px) scale(${k.toFixed(5)})`;
      overlays();
    }
    function fit(animate) { V.z = 1; V.tx = 0; V.ty = 0; view(animate); }
    function zoomAround(x, y, z, animate) {            // keep the slide point under (x, y) there… or centre it
      const k0 = fitK() * V.z, cx = (x - V.tx) / k0, cy = (y - V.ty) / k0;
      V.z = Math.min(ZMAX, Math.max(1, z));
      const k = fitK() * V.z;
      V.tx = S.box.clientWidth / 2 - cx * k; V.ty = S.box.clientHeight / 2 - cy * k;
      view(animate);
    }
    function gestures() {
      const box = S.box, pts = new Map();
      let g = null, lastTap = null;
      const local = (e) => { const r = box.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      function startPinch() {
        const [a, b] = Array.from(pts.values());
        const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, k0 = fitK() * V.z;
        g = { mode: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: V.z,
              c: { x: (m.x - V.tx) / k0, y: (m.y - V.ty) / k0 } };
      }
      box.addEventListener("pointerdown", (e) => {
        try { box.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
        const p = local(e);
        pts.set(e.pointerId, p);
        if (pts.size === 1) g = { mode: "tap", sx: p.x, sy: p.y, tx0: V.tx, ty0: V.ty, target: e.composedPath()[0] };
        else if (pts.size === 2) startPinch();
      });
      box.addEventListener("pointermove", (e) => {
        if (!pts.has(e.pointerId) || !g) return;
        const p = local(e);
        pts.set(e.pointerId, p);
        if (g.mode === "pinch" && pts.size >= 2) {
          const [a, b] = Array.from(pts.values());
          const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
          V.z = Math.min(ZMAX, Math.max(1, g.z0 * Math.hypot(a.x - b.x, a.y - b.y) / g.d0));
          const k = fitK() * V.z;
          V.tx = m.x - g.c.x * k; V.ty = m.y - g.c.y * k;
          view(false);
        } else if (pts.size === 1) {
          const dx = p.x - g.sx, dy = p.y - g.sy;
          if (g.mode === "tap" && Math.hypot(dx, dy) > SLOP) g.mode = "pan";
          if (g.mode === "pan" && V.z > 1) { V.tx = g.tx0 + dx; V.ty = g.ty0 + dy; view(false); }
        }
      });
      function end(e) {
        if (!pts.has(e.pointerId)) return;
        pts.delete(e.pointerId);
        if (!g) return;
        if (g.mode === "pinch") {                         // a finger left: the other one pans on from here
          if (pts.size === 1) { const r = Array.from(pts.values())[0]; g = { mode: "pan", sx: r.x, sy: r.y, tx0: V.tx, ty0: V.ty }; }
          else if (!pts.size) g = null;
          return;
        }
        if (!pts.size) {
          if (g.mode === "tap" && e.type === "pointerup") tap(g);
          g = null;
        }
      }
      box.addEventListener("pointerup", end);
      box.addEventListener("pointercancel", end);
      function tap(t) {
        const now = performance.now();
        const dbl = lastTap && now - lastTap.t < DBL_MS && Math.hypot(t.sx - lastTap.x, t.sy - lastTap.y) < 30;
        lastTap = dbl ? null : { t: now, x: t.sx, y: t.sy };
        if (dbl) {                                        // the first tap already selected: only the zoom changes
          if (V.z > 1.01) fit(true); else zoomAround(t.sx, t.sy, ZDBL, true);
          return;
        }
        if (it) return;                                   // an earlier version: look only, nothing to select
        const el = t.target instanceof Element ? t.target.closest("[data-e]") : null;
        select(el && el !== S.sec && S.sec.contains(el) ? "e" + el.getAttribute("data-e") : "slide");
      }
    }
    function overlays() {
      if (!S) return;
      const k = S.k, el = !it && sel !== "slide" && S.els[sel];
      if (el) {
        const b = contentRect(S, el), pad = 3 / k;
        Object.assign(S.ring.style, { left: b.x - pad + "px", top: b.y - pad + "px", width: b.w + 2 * pad + "px",
                                      height: b.h + 2 * pad + "px", borderWidth: 2 / k + "px", borderRadius: 4 / k + "px" });
      }
      S.ring.hidden = !el;
      for (const p of S.pins) p.remove();
      S.pins = [];
      if (it) return;                                     // the pins mark the current slide's elements
      elementRefs().forEach((r, i) => {
        const e = S.els[r];
        if (!e) return;
        const b = contentRect(S, e), d = 18 / k;
        const pin = document.createElement("div");
        pin.className = "mf-pin"; pin.dataset.ref = r;
        pin.textContent = String(i + 1);
        Object.assign(pin.style, { left: b.x - d / 2 + "px", top: b.y - d / 2 + "px", width: d + "px", height: d + "px",
                                   fontSize: 11 / k + "px", lineHeight: d + "px" });
        S.stage.appendChild(pin);
        S.pins.push(pin);
      });
    }
    const elementRefs = () => Object.keys(notes).filter((r) => r !== "slide").sort((a, b) => refOrder(a) - refOrder(b));

    // -- selection ------------------------------------------------------------------------------------
    function select(ref, reset) {
      if (S && sel !== "slide" && S.els[sel]) S.els[sel].removeAttribute("data-mf-sel");
      sel = S && S.els[ref] ? ref : "slide";
      if (S && sel !== "slide") S.els[sel].setAttribute("data-mf-sel", "");
      nlabel.textContent = notes[sel] ? notes[sel].label : labelFor(P, S, sel);
      note.value = notes[sel] ? notes[sel].raw : "";
      grow(note);
      wider.disabled = sel === "slide";
      if (reset && S) fit(true); else overlays();
      renderChips();
    }
    function parentRef() {
      const el = S && sel !== "slide" && S.els[sel];
      const up = el && el.parentElement && el.parentElement.closest("[data-e]");
      return up && up !== S.sec && S.sec.contains(up) ? "e" + up.getAttribute("data-e") : "slide";
    }
    function renderChips() {
      chips.textContent = "";
      const mk = (text, ref, title) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip" + (ref === sel ? " on" : ""); b.textContent = text;
        b.dataset.ref = ref; if (title) b.title = title;
        b.addEventListener("click", () => select(ref, ref === "slide"));   // «Весь слайд» also fits
        chips.appendChild(b);
      };
      elementRefs().forEach((r, i) => mk(String(i + 1), r, notes[r].label));
      mk(notes.slide ? "Весь слайд ✎" : "Весь слайд", "slide");
    }
    if (S) {
      gestures();
      wider.addEventListener("click", () => select(parentRef()));      // never changes the zoom
      if (window.ResizeObserver) new ResizeObserver(() => view(false)).observe(S.box);
      else window.addEventListener("resize", () => view(false));
      view(false);
    }

    // -- versions: «1 · 2 · ✏️ 3 · зараз»; an earlier one is shown read-only in the same box, zoom and pan kept ----
    const hist = (S && P.pv.hist) || [];
    const iters = $("iters"), badge = $("itbadge");
    const ICON = { loop: "", edit: "✏️ ", notes: "📝 ", chat: "💬 " };
    const WHAT = { loop: "", edit: "твоя правка з форми", notes: "переробка за твоїми нотатками",
                   chat: "переробка за твоєю правкою в чаті" };
    const means = (x) => x.m.map(([c, v]) => c + " " + v.toFixed(1)).join(" · ");
    const subline = (x) => means(x) || (x.b ? "лінт ✗" : x.kind === "edit" ? "твоя правка" : "");
    function showIter(x) {                               // x: a hist entry, or null for «зараз»
      if (x && x.cur) x = null;                          // that version is the one on the slide now
      if (x && !x.v) {
        x.v = makeSec(x.h);
        if (!x.v) { toast("Цю версію не вдалося показати"); return; }
      }
      const v = x ? x.v : S.now, keep = v.W === S.W && v.H === S.H;
      swapSec(S, v);
      it = x;
      $("tools").hidden = !!x;
      note.disabled = !!x;
      badge.hidden = !x;
      S.box.classList.toggle("old", !!x);
      if (x) {
        badge.textContent = `версія ${x.i} · лише перегляд`;
        nlabel.textContent = `Версія ${x.i} — лише перегляд`;
        note.value = "";
        note.placeholder = "Нотатки — лише до поточної версії: натисни «зараз»";
        grow(note);
        if (keep) view(false); else fit(false);
      } else {
        note.placeholder = "Що покращити?";
        if (!keep) fit(false);
        select(sel);                                     // label, note text, ring and pins of the current slide
      }
      renderIters();
    }
    function chip(top, sub, title, on, extra) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip it" + (on ? " on" : "") + (extra || "");
      const t = document.createElement("span");
      t.className = "it-n"; t.textContent = top; b.appendChild(t);
      if (sub) { const s = document.createElement("span"); s.className = "it-m"; s.textContent = sub; b.appendChild(s); }
      b.title = title;
      iters.appendChild(b);
      return b;
    }
    function renderIters() {
      iters.textContent = "";
      if (hist[0].i > 1) {
        const m = document.createElement("span");
        m.className = "more"; m.textContent = "…";
        m.title = `Ще ${hist[0].i - 1} старіших версій не вмістилися в посилання`;
        iters.appendChild(m);
      }
      for (const x of hist) {
        const title = [`Версія ${x.i}`, `раунд ${x.r}`, WHAT[x.kind], x.a ? "критики прийняли" : "", x.b ? "не пройшла лінт, критики не дивились" : "",
                       x.cur ? "це поточна версія" : ""].filter(Boolean).join(" · ");
        const b = chip(ICON[x.kind] + x.i + (x.a ? " ✓" : ""), subline(x), title, x === it || (!it && x.cur),
                       x.cur ? " same" : "");
        b.dataset.it = String(x.i);
        b.addEventListener("click", () => showIter(x));
      }
      const c = hist.find((x) => x.cur);
      const b = chip("зараз", c ? subline(c) : "", "Поточна версія: нотатки йдуть до неї", !it, " now");
      b.dataset.it = "now";
      b.addEventListener("click", () => showIter(null));
    }
    if (hist.length) {
      iters.hidden = false;
      renderIters();
      iters.scrollLeft = iters.scrollWidth;              // the newest versions in view
    }

    // -- notes ----------------------------------------------------------------------------------------
    note.addEventListener("input", () => {
      reopenSend();
      grow(note);
      const had = !!notes[sel];
      if (clean(note.value)) notes[sel] = { label: had ? notes[sel].label : labelFor(P, S, sel), raw: note.value };
      else delete notes[sel];
      if (had !== !!notes[sel]) { overlays(); renderChips(); }
      update();
    });

    // -- sending --------------------------------------------------------------------------------------
    function update() {
      cur = evaluate(P, notes);
      const n = cur.items.length;
      $("status").textContent = cur.ok || cur.reason === "none" ? "" : cur.reason;
      pre.textContent = cur.msg;
      copyBtn.disabled = !cur.ok;
      if (tier === "web") {
        send.textContent = n ? `Надіслати Малевичу (${n})` : "Надіслати Малевичу";
        if (cur.ok) {
          send.href = "https://t.me/" + P.bot + "?text=" + encodeURIComponent(cur.msg);
          send.removeAttribute("aria-disabled");
        } else {
          send.removeAttribute("href");
          send.setAttribute("aria-disabled", "true");
        }
      }
      if (tier === "A") {
        sendBtn.textContent = n ? `Надіслати Малевичу (${n})` : "Надіслати Малевичу";
        sendBtn.disabled = !cur.ok;
      }
    }
    function leave(url) {
      try { tg.disableClosingConfirmation(); } catch (e) { /* old client */ }
      tg.openTelegramLink(url);
      setTimeout(() => tg.close(), 300);
    }
    // tier A: an HTML button (a DOM gesture, so the clipboard works). Copy, then hand the text to the chat input,
    // and stay open: closing right after openTelegramLink loses the prefill on Android. The notes stay.
    function sendA() {
      update();
      if (!cur.ok) return;
      const msg = cur.msg;
      const copied = copy(msg);                         // starts inside the gesture
      try { tg.disableClosingConfirmation(); } catch (e) { /* old client */ }
      tg.openTelegramLink("https://t.me/" + P.bot + "?text=" + encodeURIComponent(msg));
      $("bar").hidden = true; document.body.classList.remove("has-bar");
      $("donetext").textContent = "Текст скопійовано й передано в чат. Якщо поле вводу порожнє — затисни його → Вставити → ➤";
      $("done").hidden = false;
      copied.then((ok) => {
        if (ok) return;
        $("donetext").textContent = "Текст передано в чат. Якщо поле вводу порожнє — скопіюй текст нижче, встав у чат і надішли.";
        pre.hidden = false;
      });
    }
    function reopenSend() {                              // he edits again after sending: back to the button
      if (tier !== "A" || $("done").hidden) return;
      $("done").hidden = true; pre.hidden = true;
      $("bar").hidden = false; document.body.classList.add("has-bar");
      try { tg.enableClosingConfirmation(); } catch (e) { /* old client */ }
    }
    function copyAndOpen() {
      update();
      if (!cur.ok) return;
      copy(cur.msg).then((ok) => {
        if (!ok) {
          pre.hidden = false;
          toast("Не вдалося скопіювати — виділіть текст нижче й скопіюйте вручну", 4000);
          return;
        }
        if (!inTg) return toast("Скопійовано");
        toast("Скопійовано — вставте в чат і надішліть");
        setTimeout(() => leave("https://t.me/" + P.bot), 900);
      });
    }

    copyBtn.addEventListener("click", copyAndOpen);
    if (tier === "A") {
      sendBtn.addEventListener("click", sendA);
      $("again").addEventListener("click", () => tg.openTelegramLink("https://t.me/" + P.bot));
      $("closeapp").addEventListener("click", () => tg.close());
      $("bar").hidden = false; document.body.classList.add("has-bar");
    } else if (tier === "B") {
      copyBtn.hidden = false; copyBtn.textContent = "Скопіювати й відкрити чат";
    } else if (tier === "C") {
      copyBtn.hidden = false; pre.hidden = false;
    } else {                                              // outside Telegram: a plain link
      send.hidden = false;
    }
    if (inTg && tg.MainButton) tg.MainButton.hide();      // our own button sends (tier A) or copies (B, C)

    select("slide");
    update();
    if (tg) {
      try {
        tg.ready(); tg.expand();
        if (inTg) tg.enableClosingConfirmation();
        if (inTg && typeof tg.disableVerticalSwipes === "function"
            && (typeof tg.isVersionAtLeast !== "function" || tg.isVersionAtLeast("7.7"))) tg.disableVerticalSwipes();
      } catch (e) { /* outside Telegram */ }
    }
  }
  main().catch(() => fatal(BROKEN));
})();
</script>
</body>
</html>
